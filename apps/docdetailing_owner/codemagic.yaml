# Manual preparation only. No triggers, publishing, credentials or production backend.
workflows:
  ios-approved-upload:
    name: Approved build 4 upload only (no review or release)
    instance_type: mac_mini_m2
    inputs:
      artifact_url:
        description: Verified build 4 Codemagic IPA artifact URL
        type: string
      approval:
        description: Explicit approval token for this upload
        type: string
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: "26.6"
      vars:
        APPROVED_IPA_URL: ${{ inputs.artifact_url }}
        APPROVED_BUILD_UPLOAD: ${{ inputs.approval }}
        APP_BUILD_NUMBER: "4"
    scripts:
      - name: Verify exact approved IPA and upload without review or release
        script: node scripts/upload-approved-ios.mjs
    artifacts:
      - artifacts/*.json

  apple-upload-preflight:
    name: Read-only Apple upload preflight (no upload)
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: "26.6"
    scripts:
      - name: Require the approved source branch
        script: test "$CM_BRANCH" = main
      - name: Read only the registered DocDetailing Apple app record
        script: |
          set -eu
          mkdir -p artifacts
          node scripts/apple-upload-preflight.mjs > artifacts/apple-upload-preflight.json
    artifacts:
      - artifacts/apple-upload-preflight.json

  flutter-validation:
    name: DocDetailing Flutter foundation
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.6
      xcode: "26.6"
    scripts:
      - name: Require approved source branch
        script: test "$CM_BRANCH" = main
      - name: Resolve dependencies
        script: |
          cd apps/docdetailing_owner
          flutter pub get
      - name: Analyze and test
        script: |
          cd apps/docdetailing_owner
          flutter analyze
          flutter test
  ios-unsigned:
    name: Approved unsigned iOS connectivity validation
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.6
      xcode: "26.6"
    scripts:
      - name: Require acceptance approval
        script: |
          test "$CM_BRANCH" = main
          test "$IOS_BUILD_APPROVED" = true
          test "$SHARED_BACKEND_ACCEPTED" = true
      - name: Analyze, test and build unsigned only
        script: |
          cd apps/docdetailing_owner
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --release --no-codesign --dart-define-from-file=config/staging.json

  ios-signed-staging:
    name: Approved DocDetailing staging archive (no upload)
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.6
      xcode: "26.6"
      vars:
        IOS_BUILD_APPROVED: "true"
        SHARED_BACKEND_ACCEPTED: "true"
        IOS_SIGNING_APPROVED: "true"
        APP_BUILD_NUMBER: "4"
      ios_signing:
        certificates:
          - docfamily_distribution_master_2026_09
        provisioning_profiles:
          - docdetailing_appstore_2026
    scripts:
      - name: Require approved source, backend and signing
        script: |
          set -eu
          test "$CM_BRANCH" = main
          test "$IOS_BUILD_APPROVED" = true
          test "$SHARED_BACKEND_ACCEPTED" = true
          test "$IOS_SIGNING_APPROVED" = true
          case "$APP_BUILD_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          test "$APP_BUILD_NUMBER" -gt 0
      - name: Validate app and backend configuration and retain reports
        script: bash scripts/ci-validate-ios.sh
      - name: Apply only uploaded DocDetailing signing assets
        script: |
          set -eu
          cd apps/docdetailing_owner
          xcode-project use-profiles
      - name: Archive staging client without publishing
        script: |
          set -eu
          bash scripts/ci-archive-ios.sh
          ditto -c -k --sequesterRsrc --keepParent apps/docdetailing_owner/build/ios/archive/Runner.xcarchive artifacts/Runner.xcarchive.zip
          if [ -d /tmp/xcodebuild_logs ]; then cp -R /tmp/xcodebuild_logs artifacts/xcodebuild_logs; fi
      - name: Verify archive signing and production push entitlements
        script: |
          set -eu
          result=0
          node scripts/verify-ios-archive.mjs apps/docdetailing_owner/build/ios/archive/Runner.xcarchive > artifacts/ios-signing-verification.json 2> artifacts/ios-signing-errors.log || result=$?
          node scripts/verify-ios-ipa.mjs apps/docdetailing_owner/build/ios/ipa/docdetailing_owner.ipa > artifacts/ios-ipa-verification.json 2> artifacts/ios-ipa-errors.log || result=$?
          node scripts/ios-artifact-manifest.mjs
          exit "$result"
    artifacts:
      - artifacts/**
      - apps/docdetailing_owner/build/ios/ipa/*.ipa
