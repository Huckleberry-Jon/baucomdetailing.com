name: DocDetailing independent encrypted backup
on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
permissions:
  contents: read
concurrency:
  group: docdetailing-production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.DOCDETAILING_BACKUP_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/cloud-backup.mjs create
        env:
          ALLOW_EXTERNAL_BACKUP_UPLOAD: 'true'
          BACKUP_APPROVAL_REF: ${{ vars.DOCDETAILING_BACKUP_APPROVAL_REF }}
          BACKUP_PASSPHRASE: ${{ secrets.DOCDETAILING_BACKUP_PASSPHRASE }}
          CF_ACCOUNT_ID: ${{ secrets.DOCDETAILING_CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.DOCDETAILING_D1_ID }}
          BACKUP_SOURCE_URL: https://baucomdetailing.com/api/recovery/snapshot
          BACKUP_SOURCE_TOKEN: ${{ secrets.DOCDETAILING_BACKUP_SOURCE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.DOCDETAILING_CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.DOCDETAILING_MEDIA_BUCKET }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.DOCDETAILING_R2_READ_KEY }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.DOCDETAILING_R2_READ_SECRET }}
          RECOVERY_ENDPOINT: ${{ vars.DOCDETAILING_B2_ENDPOINT }}
          RECOVERY_REGION: ${{ vars.DOCDETAILING_B2_REGION }}
          RECOVERY_BUCKET: ${{ vars.DOCDETAILING_B2_BUCKET }}
          RECOVERY_ACCESS_KEY_ID: ${{ secrets.DOCDETAILING_B2_APPEND_KEY }}
          RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.DOCDETAILING_B2_APPEND_SECRET }}
          RECOVERY_READ_ACCESS_KEY_ID: ${{ secrets.DOCDETAILING_B2_READ_KEY }}
          RECOVERY_READ_SECRET_ACCESS_KEY: ${{ secrets.DOCDETAILING_B2_READ_SECRET }}
          SOURCE_NAMESPACE: production
          RECOVERY_IMMUTABLE_DAYS: '30'
      - name: Preserve version receipts outside Backblaze
        id: receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-version-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/backup-receipts/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Report successful full restoration to independent monitor
        if: success()
        run: node scripts/report-backup-health.mjs
        env:
          BACKUP_HEALTH_TOKEN: ${{ secrets.DOCDETAILING_BACKUP_HEALTH_TOKEN }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
