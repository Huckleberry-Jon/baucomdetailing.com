<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Your booking · Baucom’s</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/customer.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">BAUCOM’S <small>MOBILE DETAILING</small></a>
    </header>
    <main class="owner">
      <h1>Your appointment request.</h1>
      <p role="status" id="status"></p>
      <article id="booking" class="card"></article>
      <div class="toolbar">
        <button id="refresh">Refresh status</button
        ><button id="accept" hidden>Accept revised time and price</button
        ><button id="cancel" hidden>Cancel request</button>
      </div>
      <p>Keep this private link secure. It expires 30 days after submission.</p>
    </main>
  </body>
</html>
